name: Terraform

on:
  pull_request:
    paths: [infra/terraform/**]
  push:
    branches: [main]
    paths: [infra/terraform/**]

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/terraform

jobs:
  # fmt + validate need no AWS access, so they always run — a PR from a
  # fork, or before the OIDC role exists (infra/README.md), still gets
  # syntax feedback.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Needs the CI role from infra/README.md step 3-4. Until AWS_ROLE_ARN is
  # set as a repo/environment variable, this is skipped rather than red —
  # bootstrapping is a one-time local step, not a CI failure.
  plan:
    needs: validate
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform plan -input=false -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}"

  # Runs only on main, and only after the infra-apply environment's
  # required reviewer approves (Settings → Environments — CLAUDE.md #10).
  apply:
    if: github.event_name == 'push' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: infra-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform apply -auto-approve -input=false -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}"

name: Smoke

# The only workflow that calls a model (CLAUDE.md #10). Manual, because it costs money
# (a fraction of a cent per run). One leg per grant the app role has in
# infra/terraform/bedrock.tf, each through the client method the app uses for it: one per model,
# and two for the chat model, whose streamed calls are an IAM action of their own. A green run
# proves every grant through the smoke role, which carries the app's Bedrock policy. A leg
# passes when one real call is recorded in llm_calls with tokens, a trace id and the cost
# pricing.yaml predicts. tests/test_config.py checks this list against the Terraform defaults.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Needs infra/README.md step 5; skipped rather than red until then.
    if: vars.AWS_SMOKE_ROLE_ARN != ''
    name: smoke (${{ matrix.use }}, ${{ matrix.model }})
    strategy:
      # One refused model must not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          - use: extract
            model: global.anthropic.claude-haiku-4-5-20251001-v1:0
            via: converse
          - use: chat
            model: global.anthropic.claude-opus-4-6-v1
            via: messages
          - use: chat streamed
            model: global.anthropic.claude-opus-4-6-v1
            via: stream
          - use: chat candidate
            model: global.anthropic.claude-sonnet-4-6
            via: messages
          - use: embed candidate
            model: amazon.titan-embed-text-v2:0
            via: embed
          - use: embed candidate
            model: cohere.embed-v4:0
            via: embed
    runs-on: ubuntu-latest
    # The smoke role trusts only this environment's OIDC subject (github_oidc.tf).
    environment: smoke
    permissions:
      contents: read
      id-token: write
    services:
      db:
        image: ghcr.io/claudio-benfatto/art-curator-db:pg16
        env:
          POSTGRES_USER: art_curator
          POSTGRES_PASSWORD: art_curator
          POSTGRES_DB: art_curator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U art_curator -d art_curator"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://art_curator:art_curator@localhost:5432/art_curator
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_SMOKE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: uv run alembic upgrade head
      # Matrix values go through env, never interpolated into the script.
      - name: Smoke call
        env:
          MODEL: ${{ matrix.model }}
          VIA: ${{ matrix.via }}
        run: uv run python -m art_curator.cli smoke --model "$MODEL" --via "$VIA"

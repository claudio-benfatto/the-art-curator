name: DB image

# Builds docker/db (Postgres 16 + PostGIS + pgvector), proves both extensions load, and on main
# publishes it to GHCR for the CI test job's service container. PRs build and verify only.

on:
  pull_request:
    paths: [docker/db/**, .github/workflows/db-image.yml]
  push:
    branches: [main]
    paths: [docker/db/**, .github/workflows/db-image.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/art-curator-db

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/db
          load: true
          tags: art-curator-db:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify extensions
        run: |
          docker run -d --name db -e POSTGRES_PASSWORD=verify art-curator-db:verify
          # -h 127.0.0.1: the entrypoint's init-time server listens on the socket only, so this
          # waits for the real server rather than the temporary one.
          timeout 60 sh -c 'until docker exec db pg_isready -U postgres -h 127.0.0.1 -q; do sleep 1; done'
          docker exec -i db psql -U postgres -v ON_ERROR_STOP=1 -f - < docker/db/verify.sql

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch so `docker compose pull` works on Apple Silicon as well as CI.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:pg16
            ${{ env.IMAGE }}:pg16-${{ github.sha }}
          cache-from: type=gha

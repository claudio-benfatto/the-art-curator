[project]
name = "art-curator"
version = "0.1.0"
description = "An LLM art curator for Catalunya."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.scripts]
art-curator = "art_curator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

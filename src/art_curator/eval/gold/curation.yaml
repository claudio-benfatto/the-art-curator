# Scripted conversations for `eval-curation` (PLAN.md § 8, P3). Written by people, never drafted
# by a model: what is asked, and what a good answer must keep to, is the judgement being tested.
#
# A scenario never names a show: shows close, and the expected answer would rot. It says who is
# asking (`persona`, read by the judge and the person judging the transcript), what the curator
# remembers of them before it starts (`profile`, as `remember` would have written it), and what
# they say, turn by turn (`user`). Each turn's `expect` holds:
#
#   dates:     the days asked about. One day (`saturday`) or [first, last]. A day is today,
#              tomorrow or a weekday, the first on or after today as the calendar lists it, and
#              `+N` adds N days (`today+13` is the calendar's last day). `last` counts from
#              `first`, so [saturday, sunday] is a weekend on any day of the week.
#   area:      {near: <place>, km: <radius>}, only when the user gives a distance or limit. The
#              place is resolved as `search_events` resolves `near`, and must name one place.
#   free:      true when the user wants nothing that costs money (an unknown price passes).
#   kinds:     only these kinds: exhibition, opening, talk, workshop, performance, screening,
#              guided_tour, concert, fair, other. Only when the user is that specific.
#   searches:  true if this turn must call search_events, false if it must not.
#   remembers: topics this turn must `remember` (media, themes, area, budget, language, access,
#              other); [] when it must remember nothing, such as a one-off plan.
#
# dates, area, free and kinds are hard constraints on every item the reply names, and carry over
# to the next turns until a turn restates them (`null` drops one). searches and remembers are
# about their own turn only. Leave out what the user did not ask for: a constraint the user never
# set measures the scenario, not the curator.
#
# Placed where the data is: the pilots with current shows sit in the Raval, Montjuïc, Poblenou and
# the Eixample, plus Vic; elsewhere only GRAF's facts-only listings (PLAN.md § 9, Coverage).
#
# Every turn is paid for. A scenario's first turn is ~$0.12 on Opus 4.6 (cache writes included), a
# follow-up within 5 minutes ~$0.04, and the judge ~$0.05 a scenario. This is the full set, 20
# scenarios and 30 turns, ~$3.80 a run with the judge; the PR 31 default keeps 10 of them (~$1.90).
# Run a subset with --scenario.

scenarios:
  - id: poblenou-video-saturday
    persona: Lives near Poblenou, likes video art and installation. First conversation.
    turns:
      - user: >-
          I have Saturday afternoon in Barcelona, I like video art and installation, I'm near
          Poblenou. What should I see?
        expect:
          dates: saturday
          searches: true
          remembers: [media]
      - user: Only what I can walk to from there, say within 2 km.
        expect:
          area: {near: Poblenou, km: 2}

  - id: raval-weekend-ca
    persona: Catalan speaker spending the weekend around the Raval; open to anything.
    turns:
      - user: Aquest cap de setmana sóc pel Raval. Què hi ha d'interessant a prop?
        expect:
          dates: [saturday, sunday]
          searches: true
          remembers: []
      - user: I diumenge al matí, hi ha alguna visita guiada?
        expect:
          dates: sunday
          kinds: [guided_tour]

  - id: free-students-es
    persona: Two art students in Barcelona with no money to spend.
    turns:
      - user: >-
          Somos estudiantes y no queremos pagar nada. ¿Qué podemos ver gratis este sábado en
          Barcelona?
        expect:
          dates: saturday
          free: true
          searches: true
          remembers: [budget]

  - id: miro-sunday-not-painting
    persona: Visitor going up Montjuïc on Sunday; finds painting dull, likes experimental work.
    turns:
      - user: >-
          We'll be up at Montjuïc on Sunday morning. Anything worth seeing near the Fundació
          Joan Miró?
        expect:
          dates: sunday
          searches: true
      - user: I'm not into painting at all. Anything more experimental?
        expect:
          remembers: [media]

  - id: profile-opens-the-conversation
    persona: Returning user who starts from Gràcia and likes photography and sculpture.
    profile:
      - {topic: area, fact: Usually starts from Gràcia.}
      - {topic: media, fact: Likes photography and sculpture; not keen on painting.}
    turns:
      - user: I'm free tomorrow evening. Any ideas?
        expect:
          dates: tomorrow
          searches: true
          remembers: []

  - id: moved-to-gracia
    persona: Returning user who lived in Poblenou and has just moved to Gràcia; likes video art.
    profile:
      - {topic: area, fact: Lives in Poblenou.}
      - {topic: media, fact: Likes video art and installation.}
    turns:
      - user: What's on this weekend near me?
        expect:
          dates: [saturday, sunday]
          searches: true
      - user: Actually, I've just moved to Gràcia. What's close to there instead?
        expect:
          searches: true
          remembers: [area]

  - id: vic-day-trip-ca
    persona: Lives in Barcelona and is spending Saturday in Vic.
    turns:
      - user: Dissabte faig una escapada a Vic. Hi ha alguna exposició per allà?
        expect:
          dates: saturday
          searches: true
          remembers: []
      - user: I a quina hora obre?
        expect:
          searches: false

  - id: girona-friday
    persona: Will be in Girona for work on Friday and has the evening free.
    turns:
      - user: I'm in Girona on Friday. Any art events in the evening?
        expect:
          dates: friday
          searches: true

  - id: openings-tonight
    persona: Likes the social side of art; goes to openings for the crowd.
    turns:
      - user: Any exhibition openings tonight in Barcelona?
        expect:
          dates: today
          kinds: [opening]
          searches: true

  - id: talks-next-week-es
    persona: Spanish speaker interested in talks and debates on contemporary art.
    turns:
      - user: La semana que viene, ¿hay charlas o conferencias sobre arte contemporáneo?
        expect:
          dates: [monday, monday+6]
          kinds: [talk]
          searches: true

  - id: one-off-plan-near-macba
    persona: Showing their visiting mother around the Raval on Saturday.
    turns:
      - user: >-
          On Saturday I'll be near the MACBA with my mother, who is visiting. What could we see
          together?
        expect:
          dates: saturday
          searches: true
          remembers: []
      - user: She uses a wheelchair. Which of these are step-free?

  - id: textile-now-ca
    persona: Catalan speaker passionate about textile art and craft.
    turns:
      - user: M'interessa molt l'art tèxtil. Hi ha alguna exposició que pugui veure avui?
        expect:
          dates: today
          searches: true

  - id: eixample-gallery-hop
    persona: Collector who prefers small commercial galleries to museums.
    turns:
      - user: >-
          On Saturday I want to do a gallery hop in the Eixample: small commercial galleries,
          not museums.
        expect:
          dates: saturday
          searches: true
      - user: Put them in an order I can walk.
        expect:
          searches: false

  - id: kids-sunday-es
    persona: Parent with children aged 6 and 9 looking for a family activity.
    turns:
      - user: Domingo con niños de 6 y 9 años. ¿Algún taller o actividad de arte para familias?
        expect:
          dates: sunday
          searches: true

  - id: ambiguous-canyelles
    persona: Staying in the Canyelles neighbourhood of Nou Barris this weekend.
    turns:
      - user: I'm staying in Canyelles this weekend. Anything within 3 km of there?
        expect:
          dates: [saturday, sunday]
      - user: The one in Barcelona, in Nou Barris.
        expect:
          area: {near: "Canyelles, Nou Barris", km: 3}
          searches: true

  - id: closing-this-weekend
    persona: Worried about missing shows before they close.
    turns:
      - user: What closes this weekend that I shouldn't miss?
        expect:
          dates: [saturday, sunday]
          searches: true

  - id: photography-two-weeks
    persona: Photography lover who can go any evening in the next two weeks.
    turns:
      - user: Any good photography shows in the next two weeks? I can go any evening.
        expect:
          dates: [today, today+13]
          searches: true
          remembers: [media]

  - id: sabadell-10km-ca
    persona: Lives in Sabadell and does not want to travel into Barcelona.
    turns:
      - user: >-
          Visc a Sabadell i no vull moure'm més de 10 km. Què hi ha aquestes dues setmanes?
        expect:
          dates: [today, today+13]
          area: {near: Sabadell, km: 10}
          searches: true
          remembers: [area]

  - id: performance-friday
    persona: Into performance and live art; free on Friday night.
    turns:
      - user: Is there any performance or live art on Friday night?
        expect:
          dates: friday
          kinds: [performance]
          searches: true

  - id: sant-antoni-narrowing
    persona: Has Saturday near Sant Antoni and wants to be told what is worth it.
    turns:
      - user: Saturday, near Sant Antoni. What's on?
        expect:
          dates: saturday
          searches: true
      - user: Too much. Just the two you would pick.
        expect:
          searches: false
      - user: Is either of them free?
        expect:
          searches: false

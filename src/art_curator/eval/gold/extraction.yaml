# The extraction gold set (PLAN.md § 8, P2): hand-checked labels that `eval-extraction` scores
# extraction and discovery against.
#
# Labels only, facts only. No page text, no summaries, no notes copied from a venue's page: the
# loader refuses any key not listed here (CLAUDE.md § 1, `tests/test_no_verbatim.py`).
#
# listings: per venue (named as in `PILOT_VENUES`, case and accents do not matter), the page(s)
#   discovery should find: where the site lists its current exhibitions or agenda. An empty list
#   says the venue has no listing we can use, so anything discovery accepts there is wrong.
#
# pages: one entry per labelled page.
#   url, venue, kind      kind is listing or detail, as in `venue_pages.kind`.
#   content_hash          `venue_pages.content_hash` of the text the labels were checked against.
#                         When the venue changes the page, the label is reported stale.
#   confirmed             true once a person has checked every item against the live page.
#                         Unconfirmed pages (drafts) are never scored.
#   partial               true on a listing labelled only as far as its first items of each kind
#                         (an archive's first 10, say). It counts towards recall and the fields,
#                         not precision: what extraction finds past those items is not judged.
#   items                 what the page announces, `[]` when nothing. A listing is labelled as
#                         extraction reads it: its first 40 exhibitions and first 40 events, in
#                         page order. A show's own page: that show and the events that belong to
#                         it, not the rest of the programme it mentions.
#     kind                exhibition (the default) or event.
#     title               as written, in the page's language, without dates or the venue's name.
#     artists             as written, one name per entry; omit when none is named.
#     start, end          YYYY-MM-DD, with the year the page means even when it does not write
#                         it. A month alone is its first and last day. Omit what the page omits.
#     at_venue            false when the page reports something held elsewhere (default true).
#
# Drafting: `eval-extraction --draft FILE` writes what extraction finds on the pages not labelled
# yet, unconfirmed, a long listing as far as its first 10 of each kind (`partial: true`). Check
# each item against the live page in a browser, then move it here.
#
#   pages:
#     - url: https://www.exemple.cat/ca/exposicions/prova-u
#       venue: Galeria Exemple
#       kind: detail
#       content_hash: 3f0c…   (64 hex characters)
#       confirmed: true
#       items:
#         - title: Prova U
#           artists: [Maria Exemple]
#           start: 2026-09-12
#           end: 2026-11-30

